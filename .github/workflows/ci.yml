# Every push / pull request: run the test suite on Linux and Windows, and check the Docker image starts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock pytest
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: tests/reports/
          if-no-files-found: ignore

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t autobrowser:ci .
      - name: Start container
        run: docker run -d --name ab -p 127.0.0.1:8000:8000 --shm-size=1g autobrowser:ci
      - name: Wait until healthy and check the API, stream and UI
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/api/state | grep -q '"ready": true'; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/api/state | tee state.json
          grep -q '"ready": true' state.json
          curl -fs http://localhost:8000/ | grep -q "vendor/primer.css"
          curl -fs -X POST -H "Content-Type: application/json" -d '{"url":"data:text/html,<h1>xin chao</h1>"}' http://localhost:8000/api/goto | grep -q '"status": "ok"'
          # first frame of the live stream must be a JPEG
          curl -s --max-time 5 http://localhost:8000/api/stream | head -c 10 | tail -c 2 | od -An -tx1 | grep -q "ff d8"
          # requests that do not come from localhost must be refused
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:8000/api/state)" = "403"
          curl -fs http://localhost:8000/api/app/version | grep -q '"mode": "docker"'
      - name: Container logs
        if: always()
        run: docker logs ab
