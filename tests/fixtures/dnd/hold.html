<!DOCTYPE html><html><head><meta charset="utf-8"><title>DnD: press and hold</title><link rel="stylesheet" href="common.css"></head>
<body>
<p>Delay sensor: the button must be held for 400ms before the drag starts; moving earlier cancels.</p>
<div class="sentence">5. I <span id="gap" class="target"></span> my homework last night.</div>
<div class="bank"><span class="word">did</span><span class="word">done</span></div>
<script>
let st = null;
document.querySelectorAll('.word').forEach(w => w.addEventListener('mousedown', e => {
  e.preventDefault();
  st = { el: w, x: e.clientX, y: e.clientY, active: false, cancelled: false, t: setTimeout(() => { if (st && !st.cancelled) st.active = true; }, 400) };
}));
document.addEventListener('mousemove', e => {
  if (!st) return;
  if (!st.active && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 4) st.cancelled = true;
});
document.addEventListener('mouseup', e => {
  if (!st) return;
  clearTimeout(st.t);
  if (st.active) {
    const hit = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.id === 'gap');
    if (hit) hit.textContent = st.el.textContent;
  }
  st = null;
});
window.__result = () => document.getElementById('gap').textContent.trim() === 'did';
</script>
</body></html>
