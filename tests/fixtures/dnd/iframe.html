<!DOCTYPE html><html><head><meta charset="utf-8"><title>DnD: inside cross-origin iframe</title><link rel="stylesheet" href="common.css"></head>
<body>
<p>The activity runs in a cross-origin iframe, like Cambridge One's player.</p>
<iframe id="player" style="width: 900px; height: 420px; border: 1px solid #ccc"></iframe>
<script>
// Same server, other hostname => different origin (localhost vs 127.0.0.1) => out-of-process iframe.
const other = location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1';
document.getElementById('player').src = `${location.protocol}//${other}:${location.port}/dnd/html5.html`;
</script>
</body></html>
