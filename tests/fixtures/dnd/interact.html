<!DOCTYPE html><html><head><meta charset="utf-8"><title>DnD: interact.js</title><link rel="stylesheet" href="common.css">
<script src="../vendor/interact.min.js"></script></head>
<body>
<p>interact.js draggable + dropzone (pointer events).</p>
<div class="sentence">5. I <span id="gap" class="dropzone"></span> my homework last night.</div>
<div class="bank"><span class="word">did</span><span class="word">done</span></div>
<script>
interact('.word').draggable({ listeners: { move(e) {
  const t = e.target; const x = (parseFloat(t.dataset.x) || 0) + e.dx, y = (parseFloat(t.dataset.y) || 0) + e.dy;
  t.style.transform = `translate(${x}px, ${y}px)`; t.dataset.x = x; t.dataset.y = y;
} } });
interact('#gap').dropzone({ accept: '.word', overlap: 'pointer', ondrop(e) { e.target.textContent = e.relatedTarget.textContent; e.relatedTarget.style.visibility = 'hidden'; } });
window.__result = () => document.getElementById('gap').textContent.trim() === 'did';
</script>
</body></html>
