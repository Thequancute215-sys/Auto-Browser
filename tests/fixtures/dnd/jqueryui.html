<!DOCTYPE html><html><head><meta charset="utf-8"><title>DnD: jQuery UI</title><link rel="stylesheet" href="common.css">
<script src="../vendor/jquery.min.js"></script><script src="../vendor/jquery-ui.min.js"></script></head>
<body>
<p>jQuery UI draggable (revert invalid) + droppable.</p>
<div class="sentence">5. I <span id="gap" class="blank"></span> my homework last night.</div>
<div class="bank"><span class="word">did</span><span class="word">done</span></div>
<script>
$('.word').draggable({ revert: 'invalid', revertDuration: 200 });
$('#gap').droppable({ drop: (e, ui) => { $('#gap').text(ui.draggable.text()); ui.draggable.hide(); } });
window.__result = () => document.getElementById('gap').textContent.trim() === 'did';
</script>
</body></html>
