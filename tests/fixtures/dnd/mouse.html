<!DOCTYPE html><html><head><meta charset="utf-8"><title>DnD: mouse events + threshold</title><link rel="stylesheet" href="common.css"></head>
<body>
<p>Custom mousedown/mousemove/mouseup library with a 5px threshold and a floating ghost (no HTML5 DnD).</p>
<div class="sentence">5. I <span id="gap" class="slot"></span> my homework last night.</div>
<div class="bank"><span class="word">did</span><span class="word">done</span></div>
<script>
let drag = null;
document.querySelectorAll('.word').forEach(w => w.addEventListener('mousedown', e => {
  drag = { el: w, x: e.clientX, y: e.clientY, ghost: null };
  e.preventDefault();
}));
document.addEventListener('mousemove', e => {
  if (!drag) return;
  if (!drag.ghost) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;
    drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add('ghost'); document.body.appendChild(drag.ghost);
  }
  drag.ghost.style.left = (e.clientX - 20) + 'px'; drag.ghost.style.top = (e.clientY - 15) + 'px';
});
document.addEventListener('mouseup', e => {
  if (!drag) return;
  if (drag.ghost) {
    drag.ghost.remove();
    const hit = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList.contains('slot'));
    if (hit) hit.textContent = drag.el.textContent;
  }
  drag = null;
});
window.__result = () => document.getElementById('gap').textContent.trim() === 'did';
</script>
</body></html>
