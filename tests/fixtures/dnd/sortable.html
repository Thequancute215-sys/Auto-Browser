<!DOCTYPE html><html><head><meta charset="utf-8"><title>DnD: SortableJS (native)</title><link rel="stylesheet" href="common.css">
<script src="../vendor/Sortable.min.js"></script>
<style>.list { display: inline-flex; gap: 8px; min-width: 120px; min-height: 36px; border: 2px dashed #888; padding: 4px; vertical-align: middle; } </style></head>
<body>
<p>SortableJS shared group: move "did" from the bank list into the gap list.</p>
<div class="sentence">5. I <div id="gap" class="list dropzone"></div> my homework last night.</div>
<div class="bank"><div id="bank" class="list"><span class="word">did</span><span class="word">done</span></div></div>
<script>
const forceFallback = location.search.includes('fallback');
document.title += forceFallback ? ' fallback' : '';
new Sortable(document.getElementById('bank'), { group: 'g', animation: 0, forceFallback });
new Sortable(document.getElementById('gap'), { group: 'g', animation: 0, forceFallback });
window.__result = () => document.getElementById('gap').textContent.trim() === 'did';
</script>
</body></html>
