<!DOCTYPE html><html><head><meta charset="utf-8"><title>DnD: tap word then tap gap</title><link rel="stylesheet" href="common.css"></head>
<body>
<p>Accessibility mode: click a word to pick it up, then click the gap to place it. Dragging does nothing.</p>
<div class="sentence">5. I <span id="gap" class="gap" role="button" tabindex="0"></span> my homework last night.</div>
<div class="bank"><span class="word" role="button" tabindex="0">did</span><span class="word" role="button" tabindex="0">done</span></div>
<script>
let picked = null;
document.querySelectorAll('.word').forEach(w => w.addEventListener('click', () => {
  document.querySelectorAll('.word').forEach(x => x.classList.remove('selected'));
  picked = w; w.classList.add('selected');
}));
document.getElementById('gap').addEventListener('click', e => { if (picked) { e.currentTarget.textContent = picked.textContent; picked.classList.remove('selected'); picked = null; } });
window.__result = () => document.getElementById('gap').textContent.trim() === 'did';
</script>
</body></html>
