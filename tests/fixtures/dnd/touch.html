<!DOCTYPE html><html><head><meta charset="utf-8"><title>DnD: touch only</title><link rel="stylesheet" href="common.css"></head>
<body>
<p>Mobile-style library: listens to touch events only.</p>
<div class="sentence">5. I <span id="gap" class="drop-zone"></span> my homework last night.</div>
<div class="bank"><span class="word">did</span><span class="word">done</span></div>
<script>
let cur = null;
document.querySelectorAll('.word').forEach(w => w.addEventListener('touchstart', e => { cur = w; e.preventDefault(); }, { passive: false }));
document.addEventListener('touchmove', e => { if (cur) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', e => {
  if (!cur) return;
  const t = e.changedTouches[0];
  const hit = document.elementsFromPoint(t.clientX, t.clientY).find(el => el.id === 'gap');
  if (hit) hit.textContent = cur.textContent;
  cur = null;
});
window.__result = () => document.getElementById('gap').textContent.trim() === 'did';
</script>
</body></html>
