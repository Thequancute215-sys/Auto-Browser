<!doctype html>
<html><head><meta charset="utf-8"><title>Script-loaded player</title></head><body>
<!-- Like h5p.org's examples: "Next" shows "Loading..." and the exercise arrives by script, after
     DOMContentLoaded. ?auto=<ms> starts loading at page load, with the response that many ms late. -->
<span id="count">1 of 2</span>
<button id="next" onclick="load(1500)">Next</button>
<div id="player">Example 1: <input id="a0"> is the capital of France.</div>
<script>
  function load(ms) {
    document.getElementById('count').textContent = '2 of 2';
    document.getElementById('player').innerHTML = '<p>Loading...</p>';
    fetch('/slow/' + ms + '/carousel.html').then(r => r.text()).then(() => {
      document.getElementById('player').innerHTML = 'Example 2: <input id="a1"> is the capital of Spain.';
    });
  }
  const auto = new URLSearchParams(location.search).get('auto');
  if (auto) load(+auto);
</script>
</body></html>
